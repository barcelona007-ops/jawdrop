# Temporizador de Jawdrop en Cloudflare (Worker solo con «cron», sin dirección web).
# Cada 2 minutos da el siguiente paso de la búsqueda si hay una a medias; cada día de madrugada empieza una nueva.
name = "escapadas-cron"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/2 * * * *", "0 4 * * *"]

# Misma base de datos que la página (caché de precios y tareas)
[[d1_databases]]
binding = "DB"
database_name = "escapadas"
database_id = "TU_ID_D1"

# Registros de cada ejecución (para ver en el panel de Cloudflare: Worker → Observability → Logs)
[observability]
enabled = true
head_sampling_rate = 1
