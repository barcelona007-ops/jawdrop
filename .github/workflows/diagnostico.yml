# Diagnóstico manual del temporizador de Cloudflare (solo lectura): ¿existe el Worker y tiene programados sus cron?
name: Diagnóstico del temporizador
on: workflow_dispatch
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Workers y programaciones
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          B=https://api.cloudflare.com/client/v4/accounts/$A/workers
          echo "== scripts"; curl -s -H "Authorization: Bearer $T" $B/scripts | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),[ (s['id'],s.get('modified_on')) for s in d.get('result') or []],d.get('errors'))"
          echo "== schedules"; curl -s -H "Authorization: Bearer $T" $B/scripts/escapadas-cron/schedules
          echo; echo "== subdominio"; curl -s -H "Authorization: Bearer $T" $B/subdomain
          echo; echo "== workers (nueva API)"; curl -s -H "Authorization: Bearer $T" $B/workers/escapadas-cron | head -c 600
      - name: Preguntar al temporizador (último latido/resultado) y dar un paso a mano
        run: |
          U=https://escapadas-cron.TU-SUBDOMINIO.workers.dev
          echo "== estado"; curl -s -m 30 -H "X-Escapadas: cron" $U/ ; echo
          echo "== paso a mano"; curl -s -m 120 -H "X-Escapadas: cron" $U/paso ; echo
