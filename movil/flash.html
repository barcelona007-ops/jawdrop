<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Jawdrop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12140f" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<!-- Para «Añadir a pantalla de inicio» en Safari: icono, nombre y pantalla completa -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escapadas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Cormorant+Garamond:wght@300&family=Figtree:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Sistema visual (boceto móvil v2, 13-10-2026): acento naranja amanecer + neutros cálidos de design.md.
   Reglas: bordes de 1 px en vez de sombras; radios 16 (tarjetas) / 10 (botones) / pastilla;
   espacios en múltiplos de 4; pesos 400-500-700; texto sobre el naranja en negro (contraste 5,2). */
:root {
  --bg: #e4e9dc;        /* lino */
  --paper: #efefe7;     /* pergamino: tarjetas */
  --ink: #16160f;
  --muted: #54584c;
  --bd: #16160f;        /* borde de tarjetas */
  --bd-soft: #b9bfae;   /* separadores suaves */
  --sun: #e5602f;       /* relleno naranja (botones, pestaña activa) */
  --sun-ink: #a63a14;   /* naranja como TEXTO sobre claro (contraste 5,6) */
  --sea: #0f6f69; --sea-soft: #cfe9e4;
  --ok: #176a39;  --ok-soft: #d6ecd9;
  --mid: #7a5000; --mid-soft: #f2e6c4;
  --hi: #a8321f;  --hi-soft: #f3d9d1;
  --rg-ganga: #0d7a3d; --rg-bueno: #b9e3c1; --rg-bueno-t: #0f4d27; --rg-hab: #f5d98a; --rg-hab-t: #5c3d00; --rg-caro: #f0a899; --rg-caro-t: #7a1f10;   /* Radar: ganga / bueno / habitual / caro */
  --r-card: 16px; --r-btn: 10px; --r-pill: 9999px;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #12140f; --paper: #1b1d18; --ink: #ece9df; --muted: #a5a99b; --bd: #4a4e43; --bd-soft: #2c2f27;
  --sun: #ff7d4d; --sun-ink: #ff7d4d;
  --rg-ganga: #3ecf7a; --rg-bueno: #1f4d30; --rg-bueno-t: #8fe3ae; --rg-hab: #54421a; --rg-hab-t: #f2d27a; --rg-caro: #5a2a22; --rg-caro-t: #f5a99a;
  --sea: #4fd1c5; --sea-soft: #12302e;
  --ok: #5fd08a; --ok-soft: #1d3524; --mid: #e8b64c; --mid-soft: #35291a; --hi: #f27a68; --hi-soft: #3a1f1b; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4; }
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); display: grid; gap: 16px; align-content: start; }
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: var(--bg); z-index: 20; pointer-events: none; }   /* tapa la zona del reloj/batería: lo que se desplaza no pasa por debajo */
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun-ink); outline-offset: 2px; }

.head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.head h1 { margin: 0; font-family: var(--f-serif); font-weight: 300; font-size: 40px; line-height: 1; letter-spacing: -0.01em; }
.alerta { margin: 10px 0; padding: 12px 14px; border-radius: 14px; background: rgba(200,60,40,.14); color: var(--ink); font-size: 14px; line-height: 1.4; border: 1px solid rgba(200,60,40,.45); }
.alerta b { color: #c23b22; }
.fresh { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.sub { font-family: var(--f-data); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.price { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Calendario de domingos */
.cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cal button, .cal .none, .cal button.none { min-height: 72px; border: 1px solid var(--bd); border-radius: var(--r-card); padding: 8px 8px; text-align: left; display: grid; gap: 0; align-content: center; cursor: pointer; }
.cal b { font-family: var(--f-data); font-size: 12px; font-weight: 500; }
.cal .price { font-size: 20px; line-height: 1.2; }
.cal small { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .ok { background: var(--ok-soft); color: var(--ok); }
.cal .mid { background: var(--mid-soft); color: var(--mid); }
.cal .hi { background: var(--hi-soft); color: var(--hi); }
.cal button.on { border-width: 2px; padding: 7px; }
.cal .none { border-style: dashed; border-color: var(--bd-soft); color: var(--muted); cursor: default; }

/* Viajes */
.list { display: grid; gap: 8px; }
.trip { width: 100%; min-height: 72px; text-align: left; cursor: pointer; background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card);
  padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.trip b { font-size: 18px; font-weight: 700; }
.trip .price { font-size: 22px; color: var(--sun-ink); text-align: right; }
.trip .hrs { grid-column: 1 / -1; font-family: var(--f-data); font-size: 13px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 0 16px; }
.trip .hrs em { font-style: normal; color: var(--muted); }
.chips { grid-column: 1 / -1; display: flex; gap: 8px; }
.chip { font-size: 13px; font-weight: 500; padding: 0 12px; line-height: 24px; border-radius: var(--r-pill); border: 1px solid var(--bd); }
.chip.new { background: var(--sea-soft); color: var(--sea); border-color: var(--sea); }

/* Botones */
.cta { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border-radius: var(--r-btn); border: 1px solid var(--bd);
  background: var(--sun); color: #16160f; font-weight: 700; text-decoration: none; cursor: pointer; width: 100%; }
.cta.ghost { background: transparent; color: var(--ink); font-weight: 500; }
.back { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; color: var(--sun-ink); font-weight: 700; }
.back:focus-visible { outline: 2px solid var(--sun-ink); outline-offset: 2px; }

/* Ficha */
.city { font-family: var(--f-serif); font-weight: 300; font-size: 48px; line-height: 1; letter-spacing: -0.01em; margin: 0; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); padding: 16px; font-size: 15px; }
.kv i { font-style: normal; color: var(--muted); }
a.kv { color: inherit; text-decoration: none; position: relative; padding-right: 36px; min-height: 44px; }
a.kv::after { content: "›"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--sun-ink); }
a.kv:active { background: var(--bd); }
.kv b { font-family: var(--f-data); font-weight: 500; font-size: 14px; text-align: right; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { min-height: 48px; border: 1px solid var(--bd); border-radius: var(--r-btn); background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }

/* Pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--bd);
  padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(5, 1fr); max-width: 480px; margin: 0 auto; }
.tab { all: unset; box-sizing: border-box; cursor: pointer; min-height: 52px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 700; }
.tab[aria-selected="true"] svg { stroke: var(--sun-ink); }
.tab:focus-visible { outline: 2px solid var(--sun-ink); outline-offset: -2px; border-radius: var(--r-btn); }

.pronto { background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); padding: 16px; display: grid; gap: 16px; }
.pronto p { margin: 0; }
.nota { margin: 0; font-size: 14px; color: var(--muted); }
.kv i.peq { font-size: 13px; }

/* Ficha de aeropuerto: plegada, para no cargar la pantalla */
.apto { background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); font-size: 15px; }
.apto summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; font-weight: 700; list-style: none; }
.apto summary::-webkit-details-marker { display: none; }
.apto summary::after { content: "+"; font-size: 22px; color: var(--sun-ink); }
.apto[open] summary::after { content: "–"; }
.apto-c { display: grid; gap: 12px; padding: 0 16px 16px; }
.apto-c h3 { margin: 0 0 2px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.apto-c p { margin: 0 0 6px; }
.apto-c a { color: var(--sun-ink); font-weight: 700; display: inline-flex; align-items: center; min-height: 44px; margin-right: 16px; }
.apto-c .sin { color: var(--muted); font-size: 14px; }
.apto-c .tr b { display: inline; }
.apto-c .tr a { display: inline; min-height: 0; margin: 0 0 0 4px; font-size: 14px; white-space: nowrap; }
.sf { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; background: var(--hi); }
.sf.alta { background: var(--ok); }
.sf.media { background: var(--mid); }

.chip.okc { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.chip.midc { background: var(--mid-soft); color: var(--mid); border-color: var(--mid); }
.chip.hic { background: var(--hi-soft); color: var(--hi); border-color: var(--hi); }
.chk { display: flex; flex-wrap: wrap; gap: 8px; }
.chk button { min-height: 44px; min-width: 48px; padding: 0 12px; border: 1px solid var(--bd); border-radius: var(--r-pill); background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; }
.chk button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.fld { display: grid; gap: 8px; }
.est { background: var(--sea-soft); color: var(--sea); border: 1px solid var(--sea); border-radius: var(--r-card); padding: 12px 16px; font-size: 15px; font-weight: 500; }
.mr-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 12px; border: 1px solid var(--bd); border-radius: var(--r-pill); overflow: hidden; background: var(--paper); }
.bar i { display: block; height: 100%; background: var(--sun); }
.maqueta { font-family: var(--f-data); font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--sun-ink); border: 1px dashed var(--sun-ink); border-radius: var(--r-btn); padding: 8px 12px; }
.sel { width: 100%; min-height: 48px; border: 1px solid var(--bd); border-radius: var(--r-btn); background: var(--paper); color: var(--ink); font: inherit; font-weight: 500; padding: 0 12px; }
.fil { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; }
.fil input { width: 22px; height: 22px; accent-color: var(--sun-ink); }
.trip .sub2 { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }

/* Pasaporte: mapa táctil + sellos */
:root { --mar: #b5d3e3; --tierra: #f5efd9; --frontera: #4a4a3c;
  /* tintas de aduana envejecida, apagadas: óxido, azul aduana, oliva, violeta, terracota (en modo oscuro, versión más clara para que se lean) */
  --sel: #8f948c; --s0: #9a4a35; --s1: #2f4a73; --s2: #5f6b3a; --s3: #5d4670; --s4: #b0654a; }
@media (prefers-color-scheme: dark) { :root { --sel: #aeb3a8; --mar: #10222c; --tierra: #5d6256; --frontera: #14160f;
  --s0: #cf8a72; --s1: #7f9bc4; --s2: #9aa66c; --s3: #a791bd; --s4: #d49a7e; } }
.mapa { height: 52vh; height: 52dvh; min-height: 320px; max-height: 560px; position: relative; background: var(--mar); border: 1px solid var(--bd); border-radius: var(--r-card); overflow: hidden; }
.mapa svg { display: block; position: absolute; left: -50%; top: -50%; width: 200%; height: 200%; transform-origin: 0 0; will-change: transform; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.mapa path { fill: var(--tierra); stroke: var(--frontera); stroke-width: var(--sw, .1); stroke-opacity: .75; stroke-linejoin: round; cursor: pointer; }
.mapa path.vis { fill: var(--sun); }
.mapa path.des { fill: var(--sea); }
.mapa path.sel { fill: var(--sel); stroke: var(--ink); stroke-opacity: 1; stroke-width: calc(var(--sw, .1) * 2.6); }   /* país elegido: gris y contorno algo más marcado, dibujado el último para que nada lo tape */
.zoom { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }
.zoom button { width: 44px; height: 44px; border: 1px solid var(--bd); border-radius: var(--r-btn); background: var(--paper); font-size: 22px; font-weight: 500; cursor: pointer; }
.cuenta { display: flex; align-items: baseline; gap: 8px; }
.cuenta b { font-family: var(--f-display); font-size: 32px; }
.cont { display: grid; gap: 12px; background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); padding: 16px; }
.cont-r { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; font-size: 14px; }
.cont-r b { font-family: var(--f-data); font-weight: 500; }
.cont-r .bar { grid-column: 1 / -1; height: 10px; }
.cont-r .bar i { background: var(--sun); }
.deseos { display: flex; flex-wrap: wrap; gap: 8px; }
.deseo { display: inline-flex; align-items: center; border: 1px solid var(--sea); background: var(--sea-soft); color: var(--sea); border-radius: var(--r-pill); font-weight: 700; font-size: 14px; }
.deseo button { all: unset; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px 0 12px; }
.deseo button + button { padding: 0 12px 0 8px; color: var(--muted); font-size: 18px; }
.deseo button:focus-visible { outline: 2px solid var(--sun-ink); border-radius: var(--r-pill); }
.ficha { animation: fichaIn .28s ease-out; background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); padding: 16px; display: grid; gap: 12px; }
.ficha h2 { margin: 0; font-family: var(--f-display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.bnd { width: 30px; height: 20px; display: block; }
.bnd-w { display: inline-flex; align-items: center; }
.ficha input[type=text] { width: 100%; min-height: 48px; border: 1px solid var(--bd); border-radius: var(--r-btn); background: var(--bg); color: var(--ink); font: inherit; padding: 0 12px; }
.anios { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 32px; }
.anio { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--bd); border-radius: var(--r-pill); padding: 0 4px 0 12px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--bg); }
.anio button { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; color: var(--muted); }
.anio button:focus-visible { outline: 2px solid var(--sun-ink); border-radius: 50%; }
.anios-v { display: grid; gap: 8px; width: 100%; }
.visita { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; border: 1px solid var(--bd); border-radius: var(--r-btn); background: var(--bg); padding: 4px 4px 4px 12px; }
.visita > b { font-variant-numeric: tabular-nums; min-width: 42px; }
.visita .modos { display: flex; gap: 2px; flex: 1; justify-content: flex-end; }
.visita .modos button { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.visita .modos button[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.visita .modos button:focus-visible { outline: 2px solid var(--sun-ink); }
.visita .modos svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.visita > button { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; font-size: 20px; color: var(--muted); }
.medios { display: flex; flex-wrap: wrap; gap: 8px; }
.medio { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; border: 1px solid var(--bd); border-radius: var(--r-pill); background: var(--bg); font-weight: 700; font-size: 14px; }
.medio svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.medio[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.medio:focus-visible { outline: 2px solid var(--sun-ink); outline-offset: 2px; }
.sellos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 4px 0; }
.sello { all: unset; box-sizing: border-box; cursor: pointer; display: block; color: var(--c); transform: rotate(var(--rot, 0deg)); }
.sello svg { display: block; width: 100%; height: auto; overflow: visible; }
.sello:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.st-t { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; fill: currentColor; }
.st-s { font-weight: 600; }
.st-m { font-family: var(--f-data); font-weight: 600; fill: currentColor; }
.st-serif { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
.st-mono { font-family: var(--f-data); font-weight: 700; }
#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: var(--r-pill); font-weight: 700; z-index: 9; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 481px) { .app { padding-top: calc(32px + env(safe-area-inset-top)); } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
@keyframes fichaIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ficha { animation: none; } }

/* Ajustes (prototipo): tarjetas por tema, interruptores y deslizador */
.cfg { background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); padding: 16px; display: grid; gap: 12px; }
.cfg h2 { margin: 0; font-family: var(--f-display); font-size: 18px; }
.cfg .nota { font-size: 13px; }
.cfg-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.cfg-row small { display: block; color: var(--muted); font-size: 13px; }
.sw { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 52px; height: 32px; border-radius: var(--r-pill); border: 1px solid var(--bd); background: var(--bg); position: relative; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.sw[aria-pressed="true"] { background: var(--sun); }
.sw[aria-pressed="true"]::after { transform: translateX(20px); }
.sw:focus-visible { outline: 2px solid var(--sun-ink); outline-offset: 2px; }
.cfg input[type=range] { width: 100%; accent-color: var(--sun-ink); min-height: 44px; }
.cfg-big { white-space: nowrap; font-family: var(--f-display); font-weight: 700; font-size: 28px; }
@media (prefers-reduced-motion: reduce) { .sw, .sw::after { transition: none; } }

/* Países nuevos: cuadrícula país × mes */
.cq-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.cq-chip { min-height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--bd); background: transparent; cursor: pointer; }
.cq-chip[aria-pressed="true"] { background: var(--sun); color: #16160f; border-color: var(--sun); font-weight: 700; }
.cq-ley { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
.cq-ley i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--bd-soft); }
.cq-tabla { overflow: auto; border: 1px solid var(--bd); border-radius: var(--r-card); background: var(--paper); max-height: 70vh; -webkit-overflow-scrolling: touch; }
.cq-tabla table { border-collapse: separate; border-spacing: 0; min-width: 100%; }
.cq-tabla th, .cq-tabla td { padding: 0; text-align: center; font-family: var(--f-data); font-size: 13px; }
.cq-tabla thead th { position: sticky; top: 0; z-index: 3; background: var(--paper); padding: 10px 0; border-bottom: 1px solid var(--bd); font-weight: 500; text-transform: uppercase; font-size: 11px; color: var(--muted); min-width: 52px; }
.cq-tabla th.pais, .cq-tabla td.pais { position: sticky; left: 0; z-index: 2; background: var(--paper); text-align: left; padding: 6px 10px; min-width: 128px; max-width: 128px; border-right: 1px solid var(--bd-soft); font-family: var(--f-body); }
.cq-tabla thead th.pais { z-index: 4; }
.cq-tabla td.pais b { display: block; font-size: 14px; line-height: 1.2; }
.cq-tabla td.pais span { font-size: 11px; color: var(--muted); }
.cq-tabla td.pais span.via { display: block; font-size: 10px; font-weight: 700; letter-spacing: .02em; color: var(--sea); }
.cq-tabla td.pais span.avi { display: block; font-size: 10px; font-weight: 700; color: #b3261e; }
.cq-tabla td.pais span.avi.sinruta { color: var(--muted); }
.avi-ficha { border-left: 3px solid #b3261e; padding: 6px 10px; background: var(--bg); border-radius: 0 8px 8px 0; font-size: 13px; }
.avi-ficha.sinruta { border-left-color: var(--muted); }
.hilo { display: grid; gap: 4px; margin: -4px 0 8px; font-size: 13px; }
.hilo a { color: var(--ink); text-decoration: none; border-left: 3px solid var(--sea); padding: 6px 10px; background: var(--bg); border-radius: 0 8px 8px 0; min-height: 32px; }
.hilo a b { font-family: var(--f-data); font-weight: 700; }
.cq-tabla td.c { padding: 3px; }
.cq-tabla td.c button { width: 100%; min-height: 44px; border: 0; border-radius: 8px; cursor: pointer; font-family: var(--f-data); font-size: 13px; font-weight: 500; }
.cq-tabla .compacta th.pais, .cq-tabla .compacta td.pais { min-width: 104px; max-width: 104px; padding: 6px 8px; }
.cq-tabla .compacta thead th { min-width: 0; font-size: 10px; }
.cq-tabla .compacta td.c { padding: 2px 1px; }
.cq-tabla .compacta td.c button { font-size: 0; border-radius: 5px; }
.cq-tabla .compacta td.pais b { font-size: 13px; }
.cq-tabla .verde, .cq-ms .verde, .cq-precio.verde { background: var(--rg-bueno); color: var(--rg-bueno-t); }
.cq-tabla .ambar, .cq-ms .ambar, .cq-precio.ambar { background: var(--rg-hab); color: var(--rg-hab-t); }
.cq-tabla .rojo, .cq-ms .rojo, .cq-precio.rojo { background: var(--rg-caro); color: var(--rg-caro-t); }
.cq-ley .verde { background: var(--rg-bueno); } .cq-ley .ambar { background: var(--rg-hab); } .cq-ley .rojo { background: var(--rg-caro); }
.cq-tabla .sin, .cq-ms .sin { background: color-mix(in srgb, var(--bd-soft) 35%, transparent); color: var(--muted); }
.cq-tabla .ganga, .cq-ms .ganga, .cq-precio.ganga { background: var(--rg-ganga); color: #fff; font-weight: 700; }
.cq-ley .ganga { background: var(--rg-ganga); } .cq-ley .gris { background: color-mix(in srgb, var(--bd-soft) 35%, transparent); }
.cq-tabla .compacta td.c button.ganga { font-size: 11px; }
.cq-tabla .compacta td.c button.ganga::before { content: "★"; }
.cq-mes { border: 0; background: transparent; font: inherit; color: inherit; text-transform: inherit; min-width: 100%; min-height: 32px; cursor: pointer; }
.cq-mes.on { color: var(--ink); font-weight: 700; text-decoration: underline; }
.cq-fil { background: var(--paper); border: 1px solid var(--bd); border-radius: var(--r-card); }
.cq-fil summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-weight: 700; list-style: none; }
.cq-fil summary::-webkit-details-marker { display: none; }
.cq-fil summary em { flex: 1; font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.cq-fil summary::after { content: "+"; font-size: 22px; color: var(--sun-ink); }
.cq-fil[open] summary::after { content: "–"; }
.cq-fil-c { display: grid; gap: 12px; padding: 0 16px 16px; }
.cq-g { display: grid; gap: 6px; }
.cq-wrap { position: relative; min-width: 0; }
.cq-wrap.mas::after { content: "›"; position: absolute; right: 0; top: 0; bottom: 0; width: 28px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 22px; color: var(--sun-ink); border-radius: 0 var(--r-card) var(--r-card) 0; background: linear-gradient(to right, transparent, var(--paper) 70%); pointer-events: none; }
.cq-tabla th.fin, .cq-tabla td.fin { min-width: 18px; width: 18px; padding: 0; background: repeating-linear-gradient(45deg, var(--bd-soft) 0 3px, transparent 3px 7px); border-left: 1px solid var(--bd); }
.cq-hoja .kv { grid-template-columns: 1fr; gap: 2px; margin: 8px 0; }
.cq-hoja .kv b { text-align: left; }
.cq-hoja .kv i.peq { margin-top: 4px; }
.cq-hoja { height: 80vh; overflow-y: auto; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--bd); border-radius: 20px 20px 0 0; padding: 20px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
.cq-hoja h2 { margin: 0 0 4px; font-family: var(--f-display); font-size: 22px; }
.cq-hoja p { margin: 6px 0; color: var(--muted); font-size: 14px; }
.cq-info { min-height: 104px; }
.cq-x { position: absolute; right: 8px; top: 8px; min-width: 44px; min-height: 44px; border: 0; background: transparent; font-size: 22px; cursor: pointer; }
.cq-precio { display: inline-block; padding: 2px 10px; border-radius: 8px; font-family: var(--f-data); font-size: 28px; font-weight: 500; margin: 8px 0; }
.cq-ms { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin: 10px 0; }
.cq-ms button { min-height: 44px; border: 0; border-radius: 8px; cursor: pointer; display: grid; place-items: center; align-content: center; font-family: var(--f-data); line-height: 1.15; }
.cq-ms button small { font-size: 10px; text-transform: uppercase; opacity: .85; }
.cq-ms button b { font-size: 13px; font-weight: 500; }

.cq-ms button.sel { outline: 2px solid var(--ink); outline-offset: 1px; }

  var TITULOS = { nuevos: "Radar", medida: "A medida", pasaporte: "Pasaporte", config: "Ajustes" };

  // Ajustes: PROTOTIPO visual. Los controles se mueven pero no guardan nada ni cambian las búsquedas.
  var CF = { ida: "dom", dist: 200, otro: true, tren: true, bus: true, ferry: true };
  var VUELTAS = {
    vie: "Vuelta el sábado desde las 20:00 o el domingo antes de las 14:30",
    sab: "Vuelta el domingo desde las 20:00 o el lunes antes de las 14:30",
    dom: "Vuelta el lunes desde las 20:00 o el martes antes de las 14:30"
  };
  function sw(k, v) { return '<button class="sw" type="button" data-sw="' + k + '" aria-pressed="' + v + '" aria-label="' + k + '"></button>'; }
  function renderConfig() {
    var dias = [["vie", "Viernes"], ["sab", "Sábado"], ["dom", "Domingo"]];
    return head("Ajustes") + '<div class="maqueta">Prototipo · aún no guarda nada</div>' +
      '<section class="cfg"><h2>Días libres</h2><p class="nota">Día de salida desde El Prat (06:00 a 10:00).</p>' +
      '<div class="chk" role="group" aria-label="Día de ida">' + dias.map(function (d) {
        return '<button type="button" data-ida="' + d[0] + '" aria-pressed="' + (CF.ida === d[0]) + '">' + d[1] + '</button>'; }).join("") + '</div>' +
      '<p class="nota" id="cfg-vuelta">' + VUELTAS[CF.ida] + '.</p>' +
      '<p class="nota">Más adelante: días sueltos pedidos con antelación.</p></section>' +
      '<section class="cfg"><h2>Otro aeropuerto a la vuelta</h2>' +
      '<div class="cfg-row"><span>Permitir volver desde otro aeropuerto<small>Llegas a uno y vuelves desde otro</small></span>' + sw("otro", CF.otro) + '</div>' +
      '<div id="cfg-dist"' + (CF.otro ? '' : ' hidden') + '><div class="cfg-row"><span>Distancia por cada 24 h fuera</span><span class="cfg-big" id="cfg-km">' + CF.dist + ' km</span></div>' +
      '<input type="range" id="cfg-rng" min="50" max="500" step="25" value="' + CF.dist + '" aria-label="Kilómetros por cada 24 horas">' +
      '<p class="nota" id="cfg-ej">Con 48 h fuera: hasta ' + (CF.dist * 2) + ' km entre aeropuertos.</p></div></section>' +
      '<section class="cfg"><h2>Cómo te mueves entre aeropuertos</h2>' +
      '<div class="cfg-row"><span>Tren</span>' + sw("tren", CF.tren) + '</div>' +
      '<div class="cfg-row"><span>Autobús o carretera</span>' + sw("bus", CF.bus) + '</div>' +
      '<div class="cfg-row"><span>Ferri<small>Solo si hay mar de por medio</small></span>' + sw("ferry", CF.ferry) + '</div>' +
      '<p class="nota">La distancia sola no basta: también contará el tiempo real del traslado.</p></section>';
  }
  function bindConfig() {
    app.querySelectorAll("[data-ida]").forEach(function (b) { b.onclick = function () { CF.ida = b.dataset.ida; render(); }; });
    app.querySelectorAll("[data-sw]").forEach(function (b) { b.onclick = function () { CF[b.dataset.sw] = !CF[b.dataset.sw]; render(); }; });
    var r = document.getElementById("cfg-rng");   // el deslizador no repinta (se perdería el arrastre): solo cambia los textos
    if (r) r.oninput = function () {
      CF.dist = +r.value;
      document.getElementById("cfg-km").textContent = CF.dist + " km";
      document.getElementById("cfg-ej").textContent = "Con 48 h fuera: hasta " + (CF.dist * 2) + " km entre aeropuertos.";
    };
  }

  function render() {
    var cq = tab === "nuevos" && CQ.vista === "semana" && paisEstado === "listo" && !cambioTab && !CQ.quieto, t0 = app.querySelector(".cq-tabla"), p0 = cq && t0 ? [t0.scrollLeft, t0.scrollTop, window.scrollY] : null;
    app.innerHTML = tab === "flash" ? (open >= 0 ? renderDetail() : renderFlash()) : tab === "nuevos" ? renderPaises() : tab === "medida" ? renderMedida() : tab === "pasaporte" ? renderPasaporte() : tab === "config" ? renderConfig() : renderPronto(TITULOS[tab]);
    if (!(tab === "medida" && M.fase === "form") && !(tab === "pasaporte" && PS.estado === "listo" && !cambioTab) && !(tab === "config" && !cambioTab) && !CQ.quieto && !p0) window.scrollTo(0, 0);
    cambioTab = false;
    if (p0) { var t1 = app.querySelector(".cq-tabla"); if (t1) { t1.scrollLeft = p0[0]; t1.scrollTop = p0[1]; } window.scrollTo(0, p0[2]); }   // refrescos de fondo no mueven la lista
    if (tab === "config") bindConfig();
    if (tab === "medida") bindMedida();
    if (tab === "pasaporte") bindPasaporte();
    if (tab === "nuevos" && paisEstado === "listo" && CQ.vista === "semana") bindCuadricula();
    if (tab === "nuevos") bindVista();
    app.querySelectorAll(".cal button").forEach(function (el) { el.onclick = function () { cur = +el.dataset.i; todos = false; render(); }; });
    app.querySelectorAll(".trip[data-t]").forEach(function (el) { el.onclick = function () { open = +el.dataset.t; libres = 0; render(); }; });
    app.querySelectorAll(".seg button").forEach(function (el) { el.onclick = function () { libres = +el.dataset.l; render(); window.scrollTo(0, document.body.scrollHeight); }; });
    var b = document.getElementById("back"); if (b) b.onclick = function () { open = -1; render(); };
    var vm = document.getElementById("vermas"); if (vm) vm.onclick = function () { todos = true; render(); };
    app.querySelectorAll("[data-r]").forEach(function (el) { el.onclick = function () { abierto = +el.dataset.r; render(); }; });
    var rp = document.getElementById("reintentarP"); if (rp) rp.onclick = cargarPaises;
    var br = document.getElementById("backR"); if (br) br.onclick = function () { abierto = -1; render(); };
    var sm = document.getElementById("selmes"); if (sm) sm.onchange = function () { mesR = +sm.value; render(); };
    var sn = document.getElementById("solonuevos"); if (sn) sn.onchange = function () { soloNuevos = sn.checked; render(); };
    var rr = document.getElementById("reintentarR"); if (rr) rr.onclick = cargarRadar;
    var rt = document.getElementById("reintentar"); if (rt) rt.onclick = cargar;
    var ba = document.getElementById("actualizar"); if (ba) ba.onclick = actualizar;
  }
  function cargar() {
    estadoCarga = "cargando"; render();
    fetch("/api/movil-flash", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { if (act.nube) return; datos = ajustarEdad(d); estadoCarga = "listo"; cur = 0; open = -1; render(); })
      .catch(function () {
        if (act.nube) return;
        if (location.protocol === "file:") { datos = EJEMPLO; estadoCarga = "listo"; } else { datos = { domingos: [] }; estadoCarga = "error"; }
        render();
      });
  }
  document.querySelectorAll(".tab").forEach(function (t) {
    t.onclick = function () {
      tab = t.dataset.tab; open = -1; abierto = -1; paisAb = -1; CQ.p = -1; cambioTab = true;
      document.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-selected", x === t ? "true" : "false"); });
      if (tab === "nuevos" && !paisD) cargarPaises(); else if (tab === "pasaporte" && !PS.vis) cargarPasaporte(); else render();
    };
  });
  datos = { domingos: [] };
  fetch("aeropuertos.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) { APTOS = d; }).catch(function () {});
  cargar();
  if (window.ESCAPADAS_PUBLICADA) { retomarNube(); cargarSalud(); marchaPreguntar(); setInterval(marchaPreguntar, 6000); }
  if (location.protocol !== "file:") {
    actPreguntar();   // si ya había una actualización en marcha (p. ej. al volver a Safari), se retoma
    var oculta = 0;
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { oculta = Date.now(); return; }
      // Versión publicada: iOS conserva la página vieja al volver a la app; tras 2 min fuera se recarga entera (código y datos nuevos).
      if (window.ESCAPADAS_PUBLICADA && oculta && Date.now() - oculta > 120000 && act.fase !== "corriendo") { location.reload(); return; }
      actPreguntar();
      if (window.ESCAPADAS_PUBLICADA && act.fase !== "corriendo") { retomarNube(); cargarSalud(); }
    });
  }
})();
</script>
</body>
</html>
